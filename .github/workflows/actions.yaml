name: CI Checks and Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'  # Run CI on pushes to any branch

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run check:eslint
      - run: npm run check:prettier
      - name: Security Audit
        run: npm run audit

  build-matrix:
    name: Build Project (Node ${{ matrix.node-version }})
    needs: [lint-format]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18   # Node 18 LTS (⚠️ Node 18 is EOL 2025-04-30)
          - 20   # Node 20 LTS (Maintenance until 2026-04-30)
          - 22   # Node 22 LTS (Active until 2025-04-30; Maintenance until 2027-04-30)
          - node # Tracks latest Node release (e.g. 23.x now, next will be 24+)
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js (${matrix.node-version})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run build
      - run: npm test

  astro-check:
    name: Astro Check (Types)
    needs: [lint-format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - run: npm run check:astro
